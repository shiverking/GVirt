op_name: asr_paged_decode_attention_fp16
operator_class: paged_decode_attention_fused_partition
target: {soc: Ascend310P3, npu_arch: 2002}
inputs:
  - {name: qkv, required: true, dtypes_chip_supported: [fp16], format: ND, shape: [B, QKV]}
  - {name: k_cache, required: true, dtypes_chip_supported: [fp16], format: BSHD, shape: [NB, BS, KVH, D]}
  - {name: v_cache, required: true, dtypes_chip_supported: [fp16], format: BSHD, shape: [NB, BS, KVH, D]}
  - {name: block_table, required: true, dtypes_chip_supported: [int32], format: ND, shape: [B, BT]}
  - {name: cached_lengths, required: true, dtypes_chip_supported: [int32], format: ND, shape: [B]}
outputs:
  - {name: output, dtypes_chip_supported: [fp16], format: ND, shape: [B, QD]}
shape_contract:
  reduction_axes: [D, KV, P]
  broadcast_axes: [B, QH]
  constraints: ["1 <= B <= 20", "1 <= kv_length <= 2048", "P <= 4", "D == 128", "BS == 128"]
dtype_contract:
  intermediate: fp32
  cast_rules:
    - "Q/K/V fp16 -> partition MMAD fp32 accumulator"
    - "partition probabilities fp32 -> fp16 -> PV MMAD fp32"
    - "partition states remain on chip and merge in FP32 before one fp16 output store"
precision_target:
  cosine_threshold: 0.999
  max_absolute_error: 0.01
  nan_policy: error
  inf_policy: clamp_via_max_subtraction
  denormal_policy: flush_to_zero
compute_equations:
  forward:
    - "partition_state_p = online_softmax_state(Q, K_p, V_p)"
    - "global_state = stable_merge(global_state, partition_state_p)"
    - "output = fp16(global_output_sum / global_exp_sum)"
  backward: null
boundary_conditions:
  - "only non-empty partitions are visited"
  - "valid kv length is cached_length + 1 for the current Decode token"
  - "block-table padding and cache slots outside valid kv length are not read"
  - "one AIC work item owns one request/query-head and writes one disjoint output row"
  - "no GM intermediate state or host synchronization exists between partitions"
source_citations:
  - {file: doc/310p_asr_ascendc/asr_attention_partition_chain_math_contract.yaml, lines: [1, 38], role: validated_partition_oracle}
  - {file: doc/310p_asr_ascendc/asr_paged_decode_attention_block_decomposition.yaml, lines: [1, 38], role: production_block_decomposition}
