op_name: asr_add_rmsnorm_fp16
target: Ascend310P3
mode: redesign
contract:
  input: fp16[tokens, 2048]
  residual_inout: fp16[tokens, 2048]
  weight: fp16[2048]
  output: fp16[tokens, 2048]
  tokens: [1, 20]
blocks:
  - phase: X
    block: elementwise-row-load
    instance_params:
      inputs: [input, residual, weight]
      aligned_bytes_per_row: 4096
      pad_tail: false
  - phase: V
    block: rms-norm
    instance_params:
      residual_add: fp32
      arithmetic_precision: fp32
      rows_per_core: strided
      cols: 2048
  - phase: O
    block: mte3-write-out
    instance_params:
      outputs: [residual_inout, output]
      fp16_cast: true
interactions:
  - between: [elementwise-row-load, rms-norm]
    sync: MTE2_V fetched-event
    overlap: false
  - between: [rms-norm, mte3-write-out]
    sync: V_MTE3 fetched-event
    overlap: false
  - between: [rms-norm-vector, rms-norm-scalar]
    sync: V_S fetched-event
    overlap: false
  - between: [rms-norm-scalar, rms-norm-vector]
    sync: S_V fetched-event
    overlap: false
resources:
  ub_bytes: 65536
  l1_bytes: 0
  l0a_bytes: 0
  l0b_bytes: 0
  l0c_bytes: 0
  event_pairs: 6
invariants:
  output_write_closure: true
  no_output_read_before_write: true
  ub_init_closure: true
  fixed_event_ids: false
