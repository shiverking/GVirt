kernel: asr_paged_decode_attention_fp16
stage: production_runtime_candidate
blocks:
  - name: paged_kv_load
    implementation: direct_bshd_gm_to_l1_nz
    validates: [non_contiguous_block_table, valid_kv_only]
  - name: qk_mmad
    implementation: low_level_load_data_mmad
    shape: [16, 16, 128]
  - name: online_softmax_partition_state
    implementation: fp32
    state: [running_max, exponential_sum, unnormalized_output_128]
    partition_tokens: 512
  - name: pv_mmad
    implementation: low_level_load_data_mmad
    shape: [16, 128, 16]
  - name: stable_partition_merge
    implementation: on_chip_fp32
    max_partitions: 4
  - name: final_normalize_store
    implementation: fp32_to_fp16_mte3
resources:
  ub_bytes: 18240
  l1_bytes: 12288
  l0a_bytes: 4096
  l0b_bytes: 4096
  l0c_bytes: 8192
  gm_intermediate_scratch_bytes: 0
events:
  dynamic_only: true
  pairs: [V_MTE3, MTE3_MTE2, MTE3_MTE1, MTE2_MTE1, MTE1_M, M_MTE1, M_V, V_M, V_S, S_V, MTE3_V]
forbidden:
  - fixed_event_id
  - high_level_matmul
  - DataCopyPad
  - LoadDataWithTranspose
  - aclnn
  - atb
